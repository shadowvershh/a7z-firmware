name: Build A7Z firmware

# 全程在 GitHub 托管 runner 上编译。
# 取源码：GitLab（Tina SDK，公开 repo 清单）+ Gitee（A7Z 板级补丁）+ GitHub（打包工具/Ubuntu base）。
# 取大文件：优先用本仓库 Release 里的 tina-a7z-large-files.tar.zst，
#          没有就自动从 MEGA 下（约 1 GB，仅 3 个项目）。
# 取基础镜像：本仓库 Release "inputs" 里
#          SD  → base-sd512-a7z.img.xz   （512 B 扇区，SD 卡/eMMC）
#          UFS → base-ufs4096-v2.img.xz  （4096 B 扇区，UFS；保留基底引导，只换 rootfs）
#
# 手动触发：Actions → Build A7Z firmware → Run workflow（matrix 同时产出 SD + UFS 两个固件）

on:
  workflow_dispatch:
    inputs:
      source_of_large_files:
        description: 'Where to get the Tina large-file packages'
        type: choice
        options: [auto, release, mega]
        default: auto
      ufs_scp_stub:
        description: 'UFS only: 1 = park the RISC-V SCP payload in the base boot blob (default 0 = leave it running)'
        type: choice
        options: ['0', '1']
        default: '0'
      scp_mode:
        description: 'Firmware variant: auto = follow the branch name (main=uart1, no-riscv-core=off)'
        type: choice
        options: [auto, uart1, off]
        default: auto
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BASE_SHA256: 977EDDFE9F9895D1DD9FFE991C0A9568BCD3B0FAB69F6B509ADE370DA6995EFF
  UFS_BASE_SHA256: a553bf3e6bdccdc53e63877044335d5b936b1cb47aa1c5aa139fcdcdb615d396
  UBUNTU_BASE_SHA256: a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2
  ROOTFS_SIZE: "3946823168"
  MANIFEST_URL: https://gitlab.com/tina5.0_aiot/manifest.git
  MANIFEST_REV: master
  MANIFEST_FILE: tina5.0_aiot-linux-v1.5.0.xml
  BSP_REPO: https://gitee.com/juping_zheng1/radxa-cubie-a7z-tina-bsp.git
  PACK_UBOOT_REV: 7f776a209b72b92e8c6a06abc83b1e7597eef5af
  MEGA_LARGE_FILES: https://mega.nz/folder/hm5m3DhD#whewc4usSeone8jJLtxxaA
  OUT_NAME_SD: routeA_ubuntu24_a7z_headless_radxa_gpu_nmtui_VARIANT_wifi_ntp_sd512.img
  OUT_NAME_UFS: routeA_ubuntu24_a7z_headless_radxa_gpu_nmtui_VARIANT_wifi_ntp_ufs4096.img
  # 变体（SCP_MODE / 启动包 / 产物名 / 排针 UART）不写死在这里，
  # 由 "Select firmware variant" 步骤按分支名自动决定（见该步骤注释）。
  # UFS 基底 v2：10 GiB，4096 B 逻辑扇区，boot blob @ 字节 1056768，板上已验证。
  # p3 起始字节两种介质相同（332 MiB = 679936 × 512）。
  UFS_BASE_IMG: cache/base-ufs.img
  # vendor 基准 boot 包（Radxa deb 提取，SHA ACAA783A…），build_a7z_uart1_boot_package.py 的 roundtrip 基线
  BASELINE_BOOT_PACKAGE: ${{ github.workspace }}/boot/boot_package_baseline.fex

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      # gh 2.102+ 不再自动读取 GITHUB_TOKEN，必须显式设置
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target: [sd, ufs]
    steps:
      - uses: actions/checkout@v4

      - name: Select firmware variant
        # 变体由分支名决定，workflow_dispatch 的 scp_mode 可覆盖：
        #   main（或其它分支）  -> uart1：编译 SCP，启动包带 scp，排针保持 vendor pinmux
        #   no-riscv-core*      -> off  ：不编译 SCP，启动包无 scp item（R 核留复位），
        #                                 并把排针上真正有的 UART 全引出来
        # 两个分支共用这一份 workflow 与脚本，只靠这里的判定分叉。
        run: |
          set -Eeuo pipefail
          VARIANT="${{ inputs.scp_mode }}"
          if [[ -z "$VARIANT" || "$VARIANT" == "auto" ]]; then
            case "${{ github.ref_name }}" in
              no-riscv-core*) VARIANT=off ;;
              *)              VARIANT=uart1 ;;
            esac
          fi
          if [[ "$VARIANT" == "off" ]]; then
            PKG=boot/boot_package_noscp.fex
            SUFFIX=noscp
            PIN_UARTS=1
          elif [[ "$VARIANT" == "uart1" ]]; then
            PKG=boot/boot_package_uart1.fex
            SUFFIX=uart1
            PIN_UARTS=0
          else
            echo "ERROR: unknown scp_mode '$VARIANT'" >&2
            exit 1
          fi
          if [[ "${{ matrix.target }}" == "sd" ]]; then MEDIA=sd512; else MEDIA=ufs4096; fi
          echo "A7Z_SCP_MODE=$VARIANT"   >> "$GITHUB_ENV"
          echo "A7Z_BOOT_PKG=$PKG"       >> "$GITHUB_ENV"
          echo "A7Z_PIN_UARTS=$PIN_UARTS" >> "$GITHUB_ENV"
          echo "OUT_NAME=routeA_ubuntu24_a7z_headless_radxa_gpu_nmtui_${SUFFIX}_wifi_ntp_${MEDIA}.img" >> "$GITHUB_ENV"
          echo "variant=$VARIANT  suffix=$SUFFIX  target=${{ matrix.target }}  boot_package=$PKG"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 rsync xz-utils zstd curl ca-certificates \
            mtools e2fsprogs dosfstools qemu-user-static binfmt-support \
            repo megatools gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          sudo update-binfmts --enable qemu-aarch64 || true
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          df -h /

      # ---------------------------------------------------------------- SDK
      - name: Sync Tina SDK (public GitLab manifest)
        run: |
          set -Eeuo pipefail
          ./scripts/fetch-sdk.sh tina-sdk 2>&1 | tail -40
          du -sh tina-sdk

      - name: Fetch Tina large-file packages
        run: |
          set -Eeuo pipefail
          MODE="${{ inputs.source_of_large_files || 'auto' }}"
          mkdir -p /tmp/large-files
          got=0
          if [[ "$MODE" == "auto" || "$MODE" == "release" ]]; then
            # 私有仓库的 Release 资产必须带 token 下载：用预装的 gh
            if gh release download inputs -R "$GITHUB_REPOSITORY" -p 'tina-a7z-large-files.tar.zst' -O /tmp/lf.tar.zst; then
              echo "==> large files from repo Release"
              tar --zstd -xf /tmp/lf.tar.zst -C /tmp/large-files
              rm -f /tmp/lf.tar.zst          # runner 磁盘紧张，压缩包解压后立即删除
              got=1
            elif [[ "$MODE" == "release" ]]; then
              echo "ERROR: tina-a7z-large-files.tar.zst missing from release 'inputs'" >&2
              exit 1
            fi
          fi
          if [[ "$got" -eq 0 ]]; then
            echo "==> large files from MEGA (only 3 projects, ~1 GB)"
            megals --reload "$MEGA_LARGE_FILES" > /tmp/mega-list.txt || true
            grep -E 'lichee/arisc|prebuilt/kernel-built/aarch64|brandy-2.0/tools' /tmp/mega-list.txt \
              | tee /tmp/mega-need.txt
            while read -r path; do
              [[ -n "$path" ]] || continue
              echo "  downloading $path"
              megadl --path /tmp/mega-dl/ "$path"
            done < /tmp/mega-need.txt
            find /tmp/mega-dl -name 'aiot-linux-v1.5.0-large-files.tar.zst' -exec \
              sh -c 'd=$(dirname "$1"); tar --zstd -xf "$1" -C "$d"' _ {} \;
            got=1
          fi
          echo "==> restoring large files into the SDK"
          # Release 包布局: tina-a7z-large-files/<checkout路径>/...（与 SDK 内路径一致，直接复制）
          BUNDLE_DIR=$(find /tmp/large-files -maxdepth 2 -type d -name 'tina-a7z-large-files' 2>/dev/null | head -1 || true)
          if [[ -n "$BUNDLE_DIR" ]]; then
            echo "  from release bundle: $BUNDLE_DIR"
            du -sh "$BUNDLE_DIR"
            rsync -a "$BUNDLE_DIR"/ tina-sdk/
            rm -rf /tmp/large-files         # 合并完成即删，省 ~2 GB
          else
            # MEGA 布局: tina5.0_aiot/<project-name>/aiot-...-large-files.tar.zst
            LARGE_FILES_DIR=$(find /tmp/large-files /tmp/mega-dl -maxdepth 6 -type d -name 'tina5.0_aiot' 2>/dev/null | head -1 || true)
            [[ -n "$LARGE_FILES_DIR" ]] || { echo "ERROR: large-files tree not found"; exit 1; }
            du -sh "$LARGE_FILES_DIR"
            ./scripts/restore-large-files.sh tina-sdk "$LARGE_FILES_DIR"
          fi

      # ------------------------------------------------------- SDK-derived parts
      - name: Build SCP firmware / DTB / AIC WiFi + ET7304 modules
        # sudo -E: 保留 BASELINE_BOOT_PACKAGE 等环境变量（sudo 默认会丢弃）
        run: SCP_MODE="$A7Z_SCP_MODE" A7Z_40PIN_UARTS="$A7Z_PIN_UARTS" sudo -E ./scripts/build-sdk-parts.sh "$PWD/tina-sdk"

      # 释放磁盘：SDK 源码在编完模块后不再需要（必须在取 base 镜像之前，否则 rootfs/UFS 阶段磁盘耗尽）
      - name: Free disk space (post SDK)
        run: |
          rm -rf tina-sdk work/sdk-parts-work /tmp/large-files /tmp/lf.tar.zst
          df -h /

      # ------------------------------------------------------------- rootfs
      - name: Fetch base image from Release (SD)
        if: matrix.target == 'sd'
        run: |
          set -Eeuo pipefail
          mkdir -p cache out work
          gh release download inputs -R "$GITHUB_REPOSITORY" -p 'base-sd512-a7z.img.xz' -O cache/base.img.xz
          xz -t cache/base.img.xz
          xz -dkf cache/base.img.xz
          echo "$BASE_SHA256  cache/base.img" | sha256sum -c -

      - name: Fetch base image from Release (UFS)
        if: matrix.target == 'ufs'
        run: |
          set -Eeuo pipefail
          mkdir -p cache out work
          gh release download inputs -R "$GITHUB_REPOSITORY" -p 'base-ufs4096-v2.img.xz' -O cache/base-ufs.img.xz
          xz -t cache/base-ufs.img.xz
          echo "$UFS_BASE_SHA256  cache/base-ufs.img.xz" | sha256sum -c -
          xz -dkf cache/base-ufs.img.xz && rm -f cache/base-ufs.img.xz

      - name: Mount vendor root (base p3, read-only)
        run: |
          set -Eeuo pipefail
          mkdir -p work/vendor
          if [[ "${{ matrix.target }}" == "sd" ]]; then
            BASE_IMG=cache/base.img
            LOOP=$(sudo losetup -f --show -o $((679936*512)) "$BASE_IMG")
            echo "LOOP=$LOOP" >> "$GITHUB_ENV"
            sudo mount -o ro "$LOOP" work/vendor
          else
            # UFS 基底 4096B 逻辑扇区；runner 的 losetup --partscan 不识别，自行解析 GPT 取 p3 偏移
            read -r P3_OFF P3_SZ < <(python3 scripts/ufs_rootfs_partition.py "$UFS_BASE_IMG" 4096)
            echo "UFS p3: offset=$P3_OFF size=$P3_SZ"
            LOOP=$(sudo losetup -f --show -o "$P3_OFF" --sizelimit "$P3_SZ" "$UFS_BASE_IMG")
            echo "LOOP=$LOOP" >> "$GITHUB_ENV"
            sudo mount -o ro "$LOOP" work/vendor
          fi

      - name: Fetch Ubuntu Base 24.04.5 arm64
        run: |
          set -Eeuo pipefail
          F=cache/ubuntu-base-24.04.5-base-arm64.tar.gz
          [[ -f $F ]] || curl -fL --retry 3 -o "$F" \
            https://cdimage.ubuntu.com/ubuntu-base/releases/24.04.5/release/ubuntu-base-24.04.5-base-arm64.tar.gz
          echo "$UBUNTU_BASE_SHA256  $F" | sha256sum -c -

      - name: Build Ubuntu 24.04 rootfs
        run: |
          set -Eeuo pipefail
          sudo -E ./rootfs/build_ubuntu24_rootfs.sh \
            --work-dir "$PWD/work/rootfs" \
            --base-tarball "$PWD/cache/ubuntu-base-24.04.5-base-arm64.tar.gz" \
            --base-sha256 "$UBUNTU_BASE_SHA256" \
            --vendor-root "$PWD/work/vendor" \
            --out-ext4 "$PWD/out/rootfs.ext4" \
            --size-bytes "$ROOTFS_SIZE"
          VLOOP=$(sudo losetup -f --show --read-only "$PWD/out/rootfs.ext4")
          sudo mkdir -p work/rootfs-verify
          sudo mount -o ro "$VLOOP" work/rootfs-verify
          sudo ./rootfs/verify_rootfs.sh "$PWD/work/rootfs-verify"
          sudo umount work/rootfs-verify
          sudo losetup -d "$VLOOP"

      - name: Apply WiFi / NTP / timezone overlay
        run: sudo ./scripts/apply_extra_overlay.sh "$PWD/out/rootfs.ext4" "$PWD/overlay"

      - name: Unmount vendor root
        if: always()
        run: |
          set +e
          mountpoint -q work/vendor && sudo umount -l work/vendor
          [[ -n "${LOOP:-}" ]] && sudo losetup -d "$LOOP"
          sudo losetup -D 2>/dev/null
          true

      # ------------------------------------------------------------ assemble
      - name: Compose 4 GiB image (SD)
        if: matrix.target == 'sd'
        run: |
          set -Eeuo pipefail
          python3 rootfs/compose_a7z_ubuntu_image.py \
            --base cache/base.img \
            --rootfs-ext4 out/rootfs.ext4 \
            --out "out/$OUT_NAME"
          rm -f cache/base.img

      # UFS：保留基底引导（boot0/U-Boot/p1/p2 均为板上已验证版本），就地替换 p3 rootfs。
      # 基底 4096 B 逻辑扇区；rootfs.ext4 dd 进 p3 后在线扩到 p3 实际大小。
      - name: Compose image (UFS)
        if: matrix.target == 'ufs'
        run: |
          set -Eeuo pipefail
          read -r P3_OFF P3_SZ < <(python3 scripts/ufs_rootfs_partition.py "$UFS_BASE_IMG" 4096)
          echo "UFS p3: offset=$P3_OFF size=$P3_SZ"
          LOOP=$(sudo losetup -f --show -o "$P3_OFF" --sizelimit "$P3_SZ" "$UFS_BASE_IMG")
          trap 'sudo losetup -d "$LOOP" 2>/dev/null || true' EXIT
          sudo dd if=out/rootfs.ext4 of="$LOOP" bs=4M conv=fsync status=progress
          sudo e2fsck -fy "$LOOP"   # resize2fs 要求原始覆写后先 fsck
          sudo resize2fs "$LOOP"
          sudo e2fsck -fn "$LOOP" && echo "e2fsck: clean"
          sudo losetup -d "$LOOP"
          trap - EXIT
          mv "$UFS_BASE_IMG" "out/$OUT_NAME"
          df -h /

      - name: Patch boot package + p2 DTB (SD)
        if: matrix.target == 'sd'
        run: |
          set -Eeuo pipefail
          python3 scripts/patch_image_boot.py \
            --image "out/$OUT_NAME" \
            --boot-package "$A7Z_BOOT_PKG" \
            --dtb dtb/sunxi-uart1.dtb \
            --report out/boot-patch.json

      - name: Park RISC-V SCP payload in the UFS boot blob (optional)
        if: matrix.target == 'ufs' && inputs.ufs_scp_stub == '1'
        run: |
          set -Eeuo pipefail
          # The UFS boot area is a U-Boot FIT image (no sunxi-package item table),
          # so the SCP cannot be dropped — it is overwritten in place with WFI.
          python3 scripts/patch_ufs_scp_stub.py \
            --image "out/$OUT_NAME" \
            --report out/ufs-scp-stub.json

      - name: Verify
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.target }}" == "sd" ]]; then
            python3 scripts/verify-radxa-img.py "out/$OUT_NAME" 512 | tail -25
            LOOP=$(sudo losetup -f --show -o $((679936*512)) "out/$OUT_NAME")
            sudo e2fsck -fn "$LOOP" && echo "e2fsck: clean"
            sudo losetup -d "$LOOP"
          else
            LOOP=$(sudo losetup -f --show -b 4096 --partscan "out/$OUT_NAME")
            trap 'sudo losetup -d "$LOOP" 2>/dev/null || true' EXIT
            sudo e2fsck -fn "${LOOP}p3" && echo "e2fsck: clean"
            sudo parted -ms "out/$OUT_NAME" unit s print || true
            sudo losetup -d "$LOOP"
            trap - EXIT
            if [[ "${{ inputs.ufs_scp_stub }}" == "1" ]]; then
              python3 scripts/patch_ufs_scp_stub.py --image "out/$OUT_NAME" --verify-only
            fi
          fi
          sha256sum "out/$OUT_NAME" | tee "out/$OUT_NAME.sha256"

      - name: Compress
        run: |
          set -Eeuo pipefail
          xz -T0 -6 -c "out/$OUT_NAME" > "out/$OUT_NAME.xz"
          xz -t "out/$OUT_NAME.xz"
          sha256sum "out/$OUT_NAME.xz" | tee "out/$OUT_NAME.xz.sha256"
          rm -f "out/$OUT_NAME"
          ls -lh out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: a7z-firmware-${{ matrix.target }}-${{ github.run_number }}
          path: |
            out/*.img.xz
            out/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload boot patch report (SD)
        if: matrix.target == 'sd'
        uses: actions/upload-artifact@v4
        with:
          name: a7z-boot-patch-${{ github.run_number }}
          path: out/boot-patch.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # ------------------------------------------------------------------ release
  # 把本次构建的固件挂到 GitHub Release，长期保存、网页直接下载（Artifacts 30 天过期）
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: a7z-*
          merge-multiple: true
          path: dist
      - name: Create release and upload firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="a7z-build-${{ github.run_number }}"
          ls -lh dist
          gh release create "$TAG" dist/*             -R "$GITHUB_REPOSITORY"             --title "A7Z firmware $TAG"             --notes "Automated build of ${{ github.sha }} (${{ github.ref_name }}). Contains SD (512B) and UFS (4096B) firmware images with SHA256 checksums."
          gh release view "$TAG" -R "$GITHUB_REPOSITORY"
