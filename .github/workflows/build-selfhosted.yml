name: Build A7Z firmware (self-hosted)

# 用已装好 44 GB SDK 的构建机作为 GitHub Actions runner。
# 无需上传 SDK，几分钟出固件。

on:
  workflow_dispatch:
    inputs:
      sdk_dir:
        description: 'Tina SDK path on the runner'
        required: false
        default: '/home/ubuntu/Desktop/radxa_a7z/tina-sdk'
        type: string
      rebuild_sdk_parts:
        description: 'Rebuild SCP boot package / DTB / AIC modules from the SDK first'
        required: false
        default: false
        type: boolean
      base_image_url:
        description: 'URL of base-sd512-a7z.img.xz (empty = look in ./cache then Release "inputs")'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BASE_SHA256: 977EDDFE9F9895D1DD9FFE991C0A9568BCD3B0FAB69F6B509ADE370DA6995EFF
  UBUNTU_BASE_SHA256: a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2
  ROOTFS_SIZE: "3946823168"
  OUT_NAME: routeA_ubuntu24_a7z_headless_radxa_gpu_nmtui_uart1_wifi_ntp.img

jobs:
  build:
    runs-on: [self-hosted, linux, a7z-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check host prerequisites
        run: |
          set -Eeuo pipefail
          SDK="${{ inputs.sdk_dir || '/home/ubuntu/Desktop/radxa_a7z/tina-sdk' }}"
          test -d "$SDK/brandy/arisc/ar100s"      || { echo "SDK missing: $SDK"; exit 1; }
          test -d "$SDK/out/a733/kernel/build"    || { echo "kernel build tree missing"; exit 1; }
          for t in python3 mcopy mshowfat xz losetup e2fsck depmod; do
            command -v "$t" >/dev/null || { echo "missing host tool: $t"; exit 1; }
          done
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "qemu-aarch64 binfmt not registered"; exit 1; }
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          df -h .

      - name: Rebuild SDK-derived parts (optional)
        if: ${{ inputs.rebuild_sdk_parts }}
        run: sudo ./scripts/build-sdk-parts.sh "$SDK"

      - name: Fetch base SD image
        run: |
          set -Eeuo pipefail
          mkdir -p work out cache
          if [[ -n "${{ inputs.base_image_url }}" ]]; then
            curl -fL --retry 3 -o cache/base.img.xz "${{ inputs.base_image_url }}"
          elif [[ -f cache/base.img.xz ]]; then
            echo "using cached base.img.xz"
          else
            curl -fL --retry 3 -o cache/base.img.xz \
              "${{ github.server_url }}/${{ github.repository }}/releases/download/inputs/base-sd512-a7z.img.xz"
          fi
          xz -t cache/base.img.xz
          xz -dkf cache/base.img.xz
          echo "$BASE_SHA256  cache/base.img" | sha256sum -c -

      - name: Mount vendor root (base p3, read-only)
        run: |
          set -Eeuo pipefail
          mkdir -p work/vendor
          LOOP=$(sudo losetup -f --show -o $((679936*512)) cache/base.img)
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo mount -o ro "$LOOP" work/vendor
          sudo findmnt -no OPTIONS --target work/vendor

      - name: Fetch Ubuntu Base 24.04.5 arm64
        run: |
          set -Eeuo pipefail
          F=cache/ubuntu-base-24.04.5-base-arm64.tar.gz
          [[ -f $F ]] || curl -fL --retry 3 -o "$F" \
            https://cdimage.ubuntu.com/ubuntu-base/releases/24.04.5/release/ubuntu-base-24.04.5-base-arm64.tar.gz
          echo "$UBUNTU_BASE_SHA256  $F" | sha256sum -c -

      - name: Build Ubuntu 24.04 rootfs
        run: |
          set -Eeuo pipefail
          sudo -E ./rootfs/build_ubuntu24_rootfs.sh \
            --work-dir "$PWD/work/rootfs" \
            --base-tarball "$PWD/cache/ubuntu-base-24.04.5-base-arm64.tar.gz" \
            --base-sha256 "$UBUNTU_BASE_SHA256" \
            --vendor-root "$PWD/work/vendor" \
            --out-ext4 "$PWD/out/rootfs.ext4" \
            --size-bytes "$ROOTFS_SIZE"
          sudo ./rootfs/verify_rootfs.sh "$PWD/out/rootfs.ext4" "$PWD/work/vendor"

      - name: Apply WiFi / NTP / timezone overlay
        run: sudo ./scripts/apply_extra_overlay.sh "$PWD/out/rootfs.ext4" "$PWD/overlay"

      - name: Unmount vendor root
        if: always()
        run: |
          set +e
          mountpoint -q work/vendor && sudo umount -l work/vendor
          [[ -n "${LOOP:-}" ]] && sudo losetup -d "$LOOP"
          true

      - name: Compose 4 GiB image
        run: |
          set -Eeuo pipefail
          python3 rootfs/compose_a7z_ubuntu_image.py \
            --base cache/base.img \
            --rootfs-ext4 out/rootfs.ext4 \
            --out "out/$OUT_NAME"

      - name: Patch boot package + p2 DTB
        run: |
          set -Eeuo pipefail
          python3 scripts/patch_image_boot.py \
            --image "out/$OUT_NAME" \
            --boot-package boot/boot_package_uart1.fex \
            --dtb dtb/sunxi-uart1.dtb \
            --report out/boot-patch.json

      - name: Verify image
        run: |
          set -Eeuo pipefail
          python3 rootfs/compose_a7z_ubuntu_image.py --help >/dev/null
          python3 scripts/verify-radxa-img.py "out/$OUT_NAME" 512 | tail -25
          sudo e2fsck -fn "$(sudo losetup -f --show -o $((679936*512)) "out/$OUT_NAME")" || true
          sudo losetup -D || true
          sha256sum "out/$OUT_NAME" | tee "out/$OUT_NAME.sha256"

      - name: Compress
        run: |
          set -Eeuo pipefail
          xz -T0 -6 -c "out/$OUT_NAME" > "out/$OUT_NAME.xz"
          xz -t "out/$OUT_NAME.xz"
          sha256sum "out/$OUT_NAME.xz" | tee "out/$OUT_NAME.xz.sha256"
          ls -l out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: a7z-firmware-${{ github.run_number }}
          path: |
            out/*.img.xz
            out/*.sha256
            out/boot-patch.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
