name: Debug gh
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          gh --version | head -1
          echo "--- auth status:"; gh auth status 2>&1 || true
          echo "--- view release:"; gh release view inputs -R "$GITHUB_REPOSITORY" 2>&1 | head -4 || true
          echo "--- api assets:"; gh api "repos/$GITHUB_REPOSITORY/releases/tags/inputs" --jq '.assets[].name' 2>&1 || true
          echo "--- download:"; gh release download inputs -R "$GITHUB_REPOSITORY" -p 'tina-a7z-large-files.tar.zst' -O /tmp/lf.tar.zst 2>&1 | head -3 || true; ls -la /tmp/lf.tar.zst 2>/dev/null || true
