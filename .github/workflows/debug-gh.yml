name: Debug gh
on: workflow_dispatch
permissions: contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          gh auth status 2>&1 || true
          echo "--- env token set: ${GITHUB_TOKEN:+yes}"
          gh release view inputs -R "$GITHUB_REPOSITORY" 2>&1 | head -5 || true
          echo "--- with GH_TOKEN:"
          GH_TOKEN="${{ github.token }}" gh release view inputs -R "$GITHUB_REPOSITORY" 2>&1 | head -5 || true
          echo "--- gh version: $(gh --version | head -1)"
          echo "--- api try:"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/inputs" --jq '.assets[].name' 2>&1 || true
